name: Per-draft view preview

# Renders the per-draft view (report/v2): open relays from the newest published
# nightly, docker pairs from confined per-draft runs (run-interop-pinned.sh).
# The confined runs execute only on the vpm-real label or a run_pinned dispatch;
# other renders reuse the stored ones in previews/<slug>/pinned/. Same-repo PRs
# publish to gh-pages previews/<slug>/ with one link comment; forks get an artifact.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - 'report/v2/**'
      - 'run-interop-pinned.sh'
      - 'implementations.json'
      - '.github/workflows/v2-preview.yml'
  workflow_dispatch:
    inputs:
      run_pinned:
        description: 'Run the confined per-draft docker runs before rendering'
        type: boolean
        default: false
  schedule:
    - cron: '0 3 * * 0'  # weekly: prune stale previews

permissions:
  contents: read

concurrency:
  group: v2-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pinned-plan:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.run_pinned) ||
      (github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'vpm-real')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      relays: ${{ steps.relays.outputs.relays }}
    steps:
      - uses: actions/checkout@v4
      - name: List docker relays
        id: relays
        run: |
          echo "relays=$(jq -c '[.implementations | to_entries[] | select(.value.roles.relay.docker.image?) | .key]' implementations.json)" >> "$GITHUB_OUTPUT"

  pinned:
    needs: pinned-plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        relay: ${{ fromJSON(needs.pinned-plan.outputs.relays) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pull images
        env:
          RELAY: ${{ matrix.relay }}
        run: |
          # Every client image and per-draft client image, plus this relay's.
          jq -r --arg relay "$RELAY" '
            [.implementations[].roles.client | select(.) | .docker.image?, (.confine.images? // {} | .[])]
            + [.implementations[$relay].roles.relay | .docker.image?, (.confine.images? // {} | .[])]
            | .[] | select(. != null)' implementations.json \
            | grep '^ghcr.io/' | sort -u \
            | while read -r image; do docker pull -q "$image" || echo "WARNING: failed to pull $image"; done

      - name: Build this relay's adapter
        continue-on-error: true
        env:
          RELAY: ${{ matrix.relay }}
        run: |
          jq -r --arg relay "$RELAY" '.implementations[$relay].roles.relay.docker
            | select(.build.dockerfile? // "" | startswith("adapters/"))
            | "\(.image)|\(.build.dockerfile)|\(.build.context)"' implementations.json \
            | while IFS='|' read -r image dockerfile context; do
                docker build -t "$image" -f "$dockerfile" "$context"
              done

      - name: Generate TLS certificates
        run: ./generate-certs.sh ./certs

      - name: Run confined per-draft pairs
        run: ./run-interop-pinned.sh --relay "${{ matrix.relay }}"

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: pinned-${{ matrix.relay }}
          path: results
          retention-days: 14

  render:
    needs: pinned
    if: always() && github.event_name != 'schedule' && needs.pinned.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write       # previews/ on gh-pages (same-repo PRs only)
      pull-requests: write  # preview link comment
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: main

      - name: Find the newest published run
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dir=$(gh api "repos/${{ github.repository }}/contents/results?ref=gh-pages" \
                  --jq '[.[] | select(.type == "dir") | .name] | sort | last')
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          echo "Rendering results/$dir"

      - name: Checkout published results
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages-site
          sparse-checkout: |
            results/${{ steps.latest.outputs.dir }}
            previews

      - name: Download confined runs
        if: needs.pinned.result == 'success' || needs.pinned.result == 'failure'
        uses: actions/download-artifact@v4
        with:
          pattern: pinned-*
          path: pinned-shards

      - name: Render
        id: render
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            slug="pr-${{ github.event.pull_request.number }}"
          else
            slug="per-draft-view"
          fi
          out="gh-pages-site/previews/$slug"
          mkdir -p "$out"
          # Replace the rendered files; keep stored confined runs unless new ones arrived.
          find "$out" -mindepth 1 -maxdepth 1 ! -name pinned -exec rm -rf {} +
          if [ -d pinned-shards ]; then
            rm -rf "$out/pinned" && mkdir -p "$out/pinned"
            mapfile -t shards < <(find pinned-shards -name summary.json -printf '%h\n' | sort)
            for d in "${shards[@]}"; do find "$d" -maxdepth 1 -name '*.log' -exec cp {} "$out/pinned/" \; ; done
            jq -s '{runs: [.[].runs[]], pinned: true, drafts: ([.[].drafts[]] | unique | reverse),
                    timestamp: (map(.timestamp) | min)}' "${shards[@]/%//summary.json}" > "$out/pinned/summary.json"
          fi
          pinned_args=()
          [ -f "$out/pinned/summary.json" ] && pinned_args=(--pinned "$out/pinned")
          python3 main/report/v2/generate.py "gh-pages-site/results/${{ steps.latest.outputs.dir }}" \
            "${pinned_args[@]}" --out "$out" --config main/implementations.json \
            --log-base "../../results/${{ steps.latest.outputs.dir }}"
          echo "slug=$slug" >> "$GITHUB_OUTPUT"

      - name: Upload preview
        uses: actions/upload-artifact@v4
        with:
          name: per-draft-view
          path: gh-pages-site/previews/${{ steps.render.outputs.slug }}
          retention-days: 14

      - name: Publish to gh-pages previews/
        id: publish
        if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
        working-directory: gh-pages-site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "previews/${{ steps.render.outputs.slug }}"
          if git diff --cached --quiet; then
            echo "No preview change."
          else
            git commit -m "Per-draft view preview: ${{ steps.render.outputs.slug }} (results ${{ steps.latest.outputs.dir }})"
            git push origin gh-pages
          fi
          url="https://$(echo '${{ github.repository_owner }}' | tr 'A-Z' 'a-z').github.io/$(echo '${{ github.repository }}' | cut -d/ -f2)/previews/${{ steps.render.outputs.slug }}/"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Per-draft view (results ${{ steps.latest.outputs.dir }}): $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment the preview link
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mark="<!-- vpm-preview-link -->"
          body="$mark"$'\n'"**Per-draft view** of the latest nightly (\`results/${{ steps.latest.outputs.dir }}\`): ${{ steps.publish.outputs.url }}"
          id=$(gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
                 --jq "map(select(.body | contains(\"$mark\"))) | .[0].id // empty")
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$id" -f body="$body" >/dev/null
          else
            gh api -X POST "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" -f body="$body" >/dev/null
          fi

  prune:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages-site
          sparse-checkout: previews
          fetch-depth: 0  # last-touched times come from history
          filter: blob:none
      - name: Remove previews untouched for 14 days
        working-directory: gh-pages-site
        run: |
          [ -d previews ] || { echo "No previews."; exit 0; }
          cutoff=$(date -u -d '14 days ago' +%s)
          for d in previews/*/; do
            last=$(git log -1 --format=%ct -- "$d")
            [ -n "$last" ] && [ "$last" -lt "$cutoff" ] && git rm -rq "$d" && echo "pruned $d"
          done
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --cached --quiet; then
            git commit -m "Prune stale previews"
            git push origin gh-pages
          fi
