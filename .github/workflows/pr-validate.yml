name: PR Registration Validation

# Default checks for PRs that add/remove/edit a client or relay registration.
# Read-only and push-free: it validates the registration, shows the test plan
# that WOULD run, and checks that the registered image exists. It never runs
# the interop suite (that is the maintainer-gated live run) and never publishes.
on:
  pull_request:
    paths:
      - 'implementations.json'
      - 'implementations.schema.json'
      - 'validate-registration.sh'
      - '.github/workflows/pr-validate.yml'
      - 'Makefile'
      - 'docs/TEST-SPECIFICATIONS.md'
      - 'docs/MOXYGEN-*.md'
      - 'docs/moxygen-draft18-support-profile*.json'
      - 'scripts/*moxygen-draft18*.sh'

permissions:
  contents: read

concurrency:
  group: pr-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-registration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          # Full history + the base branch so we can diff to find changed impls.
          fetch-depth: 0

      - name: Fetch base branch
        run: git fetch --no-tags --quiet origin "${{ github.base_ref }}"

      - name: Install schema validator
        run: python3 -m pip install --quiet jsonschema

      - name: Validate moxygen draft-18 profile
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          import jsonschema

          schema = json.loads(Path("docs/moxygen-draft18-support-profile.schema.json").read_text())
          profile = json.loads(Path("docs/moxygen-draft18-support-profile.json").read_text())
          jsonschema.Draft7Validator.check_schema(schema)
          jsonschema.Draft7Validator(
              schema,
              format_checker=jsonschema.FormatChecker(),
          ).validate(profile)
          PY
          ./scripts/validate-moxygen-draft18-profile.sh
          ./scripts/test-moxygen-draft18-profile-validator.sh
          bash -n \
            scripts/validate-moxygen-draft18-schema.sh \
            scripts/validate-moxygen-draft18-profile.sh \
            scripts/validate-moxygen-draft18-result.sh \
            scripts/test-moxygen-draft18-profile-validator.sh

      - name: Validate registration
        run: |
          ./validate-registration.sh \
            --base "origin/${{ github.base_ref }}" \
            --summary "$GITHUB_STEP_SUMMARY"
