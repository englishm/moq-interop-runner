name: Interop Report

on:
  schedule:
    - cron: '0 0 * * *'  # Daily at midnight UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Validate the report/publish path without pushing to gh-pages (artifact + summary only)'
        type: boolean
        default: false
      skip_publish:
        description: 'Run the sharded tests and merge the results, but do not push to gh-pages (artifact + summary only)'
        type: boolean
        default: false
  pull_request:
    # Self-validation for changes to the report/publish machinery (like this
    # one). Path-scoped to reporter/workflow files so it runs on harness PRs
    # but NOT on the common contributor registration PR (implementations.json),
    # which gets its own schema gate in a later PR.
    paths:
      - '.github/workflows/interop-report.yml'
      - 'generate-report.sh'
      - 'lib/**'


# Least privilege by default: read-only. Only the nightly publish job is
# granted write access (below), so the dry-run job can never push to gh-pages.
permissions:
  contents: read

concurrency:
  # Separate group per ref so dry-runs never queue behind / cancel the nightly
  # (which always runs on the default branch).
  group: interop-report-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The nightly runs one test job per relay in parallel, then merges and
  # publishes. Publishes for effect: nightly schedule, or a maintainer dispatch
  # that is NOT a dry-run. Never on pull_request.
  plan:
    if: >-
      github.repository == 'englishm/moq-interop-runner' &&
      github.event_name != 'pull_request' &&
      !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      relays: ${{ steps.relays.outputs.relays }}
    steps:
      - uses: actions/checkout@v4

      - name: List relays
        id: relays
        run: |
          echo "relays=$(jq -c '[.implementations | to_entries[] | select(.value.roles.relay) | .key]' implementations.json)" >> "$GITHUB_OUTPUT"

  test:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        relay: ${{ fromJSON(needs.plan.outputs.relays) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: main

      - name: Pull pre-built images from GHCR
        working-directory: main
        env:
          RELAY: ${{ matrix.relay }}
        run: |
          # Every client image, plus this shard's relay image.
          jq -r --arg relay "$RELAY" '
            [.implementations[].roles.client.docker.image?,
             .implementations[$relay].roles.relay.docker.image?]
            | .[] | select(. != null)' implementations.json \
            | grep '^ghcr.io/' \
            | sort -u \
            | while read -r image; do
                echo "Pulling $image..."
                docker pull "$image" || echo "WARNING: Failed to pull $image"
              done

      - name: Build adapters
        working-directory: main
        continue-on-error: true  # Adapter builds may fail (e.g., disk space) — run what we can
        env:
          RELAY: ${{ matrix.relay }}
        run: |
          # Client adapters, plus this shard's relay adapter. A failed build is
          # reported and the rest still build.
          jq -r --arg relay "$RELAY" '
            .implementations | to_entries[] | .key as $impl | .value.roles | to_entries[]
            | select(.key == "client" or ($impl == $relay and .key == "relay"))
            | .value.docker
            | select(.build.dockerfile? // "" | startswith("adapters/"))
            | "\(.image)|\(.build.dockerfile)|\(.build.context)"' implementations.json \
            | while IFS='|' read -r image dockerfile context; do
                echo "Building adapter: $image"
                docker build -t "$image" -f "$dockerfile" "$context" \
                  || echo "::warning::adapter build failed: $image"
              done

      - name: Generate TLS certificates
        working-directory: main
        run: ./generate-certs.sh ./certs

      - name: Run interop tests
        working-directory: main
        continue-on-error: true  # Some tests may fail — publish results regardless
        env:
          RELAY: ${{ matrix.relay }}
        run: ./run-interop-tests.sh --relay "$RELAY"

      - name: Upload shard results
        # A shard cancelled at its timeout still uploads the runs it finished.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.relay }}
          path: |
            main/results
            main/mlog
          if-no-files-found: warn
          retention-days: 7

  publish:
    needs: [plan, test]
    # Shards that fail or time out still publish; a cancelled run does not.
    if: "!cancelled() && needs.plan.result == 'success'"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write  # publishes to gh-pages
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          path: main

      - name: Checkout gh-pages
        if: "!inputs.skip_publish"
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages-site

      - name: Download shard results
        uses: actions/download-artifact@v4
        with:
          pattern: shard-*
          path: shards

      - name: Merge shard results
        id: merge
        env:
          PLANNED: ${{ needs.plan.outputs.relays }}
        run: |
          # A shard's results dir is wherever its summary.json landed: an
          # artifact is rooted at the deepest directory its files share.
          mapfile -t shard_dirs < <(find shards -name summary.json -printf '%h\n' | sort)
          # Planned relays whose shard uploaded no summary.json.
          mapfile -t present < <(find shards -name summary.json | cut -d/ -f2 | sed 's/^shard-//' | sort -u)
          mapfile -t missing < <(jq -r '.[]' <<<"$PLANNED" | grep -vxF -f <(printf '%s\n' "${present[@]}") || true)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::warning title=Missing shards::No results from: ${missing[*]}"
          fi
          if [ ${#shard_dirs[@]} -eq 0 ]; then
            echo "No shard results — nothing to publish"
            exit 0
          fi
          # Name the merged run after the earliest shard, like a single run.
          TIMESTAMP=$(for d in "${shard_dirs[@]}"; do basename "$d"; done | sort | head -1)
          main/merge-results.sh "main/results/$TIMESTAMP" "${shard_dirs[@]}"
          if [ ${#missing[@]} -gt 0 ]; then
            jq '.missing_relays = $ARGS.positional' "main/results/$TIMESTAMP/summary.json" \
              --args "${missing[@]}" > merged-summary.json
            mv merged-summary.json "main/results/$TIMESTAMP/summary.json"
          fi
          for relay_dir in shards/shard-*; do
            relay="${relay_dir#shards/shard-}"
            if [ -d "$relay_dir/mlog" ] && [ "$(ls -A "$relay_dir/mlog" 2>/dev/null)" ]; then
              mkdir -p "main/mlog/$relay"
              cp -r "$relay_dir/mlog/"* "main/mlog/$relay/"
            fi
          done
          echo "timestamp=$TIMESTAMP" >> "$GITHUB_OUTPUT"
          {
            echo "## Interop run $TIMESTAMP"
            echo ""
            echo "| Shards | Runs | Pass | Fail | Skip |"
            echo "|---|---|---|---|---|"
            jq -r --arg n "${#shard_dirs[@]}" '"| \($n) | \(.runs | length) | \([.runs[] | select(.status == "pass")] | length) | \([.runs[] | select(.status == "fail" or .status == "timeout")] | length) | \([.runs[] | select(.status == "skip")] | length) |"' "main/results/$TIMESTAMP/summary.json"
            if [ ${#missing[@]} -gt 0 ]; then
              echo ""
              echo "**No results from:** ${missing[*]}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload merged results
        if: inputs.skip_publish && steps.merge.outputs.timestamp != ''
        uses: actions/upload-artifact@v4
        with:
          name: merged-results
          path: main/results/${{ steps.merge.outputs.timestamp }}
          retention-days: 7

      - name: Publish results
        if: "!inputs.skip_publish && steps.merge.outputs.timestamp != ''"
        env:
          TIMESTAMP: ${{ steps.merge.outputs.timestamp }}
        run: |
          NEW_RESULT="main/results/$TIMESTAMP"
          DEST="gh-pages-site/results/$TIMESTAMP"

          mkdir -p "$DEST"
          cp -r "$NEW_RESULT/"* "$DEST/"

          # Copy mlogs into results if they exist (produced by Docker-based tests)
          if [ -d main/mlog ] && [ "$(ls -A main/mlog 2>/dev/null)" ]; then
            mkdir -p "$DEST/mlog"
            cp -r main/mlog/* "$DEST/mlog/"
          fi

          # Generate index and detail reports for all runs
          cp main/generate-report.sh gh-pages-site/
          cp -r main/lib gh-pages-site/

          cd gh-pages-site
          # Additive: only (re)generate the index + the detail report for the
          # new run. Old detail reports are immutable and already committed, so
          # regenerating all ~150 of them every night was the main cause of the
          # Publish step blowing past the 60-min job timeout.
          ./generate-report.sh "results/$TIMESTAMP"

          mv results/index.html index.html
          # Safer replacement: only modify hrefs that look like dates (YYYY-)
          sed -i 's|href="\([0-9]\{4\}-\)|href="results/\1|g' index.html
          # Fix back-links in detail reports: index.html moved from results/ to site root
          sed -i 's|href="../index.html"|href="../../index.html"|g' results/*/report.html

          rm generate-report.sh
          rm -rf lib

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add .
          git commit -m "Add interop results for $TIMESTAMP"
          git push origin gh-pages

  dry-run-report:
    # Validates the report/publish path without touching the live site. It
    # exercises the real nightly publish logic (index + one new detail) against
    # the already-published results, ASSERTS the additive property (no existing
    # detail report is rewritten — the regression that caused the timeout),
    # reports generation time + a result summary inline, and uploads the
    # rendered site as an artifact. Read-only: it can never push to gh-pages.
    #
    # Runs automatically on reporter/workflow PRs, and on a maintainer
    # `workflow_dispatch` with dry_run=true (dispatch requires write access).
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && inputs.dry_run)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout ref
        uses: actions/checkout@v4
        with:
          path: main

      - name: Checkout gh-pages (published results)
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages-site

      - name: Regenerate report and validate additive behavior
        working-directory: gh-pages-site
        run: |
          set -euo pipefail
          cp ../main/generate-report.sh .
          cp -r ../main/lib .

          LATEST=$(ls -1d results/*/ 2>/dev/null | sort | tail -1 | xargs -r basename || true)
          if [ -z "${LATEST:-}" ]; then
            echo "No published results to render — nothing to validate." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Synthesize a fresh run from the latest one so we exercise the real
          # nightly path: generate the index + ONE new detail report.
          NEWTS="dryrun-preview"
          rm -rf "results/$NEWTS"
          cp -r "results/$LATEST" "results/$NEWTS"

          start=$(date +%s)
          ./generate-report.sh "results/$NEWTS"
          elapsed=$(( $(date +%s) - start ))

          mv results/index.html index.html
          sed -i 's|href="\([0-9]\{4\}-\)|href="results/\1|g' index.html
          sed -i 's|href="../index.html"|href="../../index.html"|g' results/*/report.html
          rm generate-report.sh
          rm -rf lib

          # Assert additive: no PRE-EXISTING detail report may be modified.
          modified_existing=$(git diff --name-only -- 'results/**/report.html' \
            | { grep -v "results/$NEWTS/" || true; } | wc -l | tr -d ' ')
          scanned=$(ls -1d results/*/ | { grep -v "results/$NEWTS/" || true; } | wc -l | tr -d ' ')

          {
            echo "## Interop report — additive publish dry-run"
            echo ""
            echo "| Check | Value |"
            echo "|---|---|"
            echo "| Published runs scanned | $scanned |"
            echo "| Generation time (index + 1 new detail) | ${elapsed}s |"
            echo "| Pre-existing detail reports modified | $modified_existing (expected 0) |"
            echo ""
            if [ "$modified_existing" -eq 0 ]; then
              echo "✅ **Additive** — regenerating touched only the new run + index."
            else
              echo "❌ **Not additive** — $modified_existing existing report(s) rewritten. This is the regression that stalls the nightly."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          [ "$modified_existing" -eq 0 ]

      - name: Upload rendered site
        uses: actions/upload-artifact@v4
        with:
          name: report-preview
          path: |
            gh-pages-site
            !gh-pages-site/.git
          retention-days: 7

