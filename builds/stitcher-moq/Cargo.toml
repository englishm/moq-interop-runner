[package]
name = "stitcher-moq-client"
version = "0.2.0"
edition = "2021"

[dependencies]
# moq-tokio 0.19.35 / moq-net 0.3.22 is the moq-relay 0.17.15 release train (2026-11-08), which
# Paramount's relay runs. It carries moq-dev #8035: a Hop ID at or above 2^62 reads as unknown.
# Before it moq-net refused such an ID and closed the session, and moqx picks a random 64-bit ID
# per process, so against about three in four moqx instances every case after setup-only failed.
# It keeps moq-dev #5094 (a draft-22 LOCATION_FILTER carries its Location Filter Type) and
# moq-dev #4195 (EXPIRES in SUBSCRIBE_OK accepted). moq-tokio re-exports moq-net. Cargo.lock holds
# the exact pair; the image build copies it.
moq-tokio = "0.19.35"
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs"] }
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
