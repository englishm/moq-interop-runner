[package]
name = "moq-net-media-ts-client"
version = "0.1.0"
edition = "2021"

[dependencies]
# moq-tokio 0.19.28 / moq-net 0.3.15 is the pair the moq-dev-rs and stitcher-moq-media clients
# build against, so the moq-net clients in this repository speak the same wire code. moq-tokio
# re-exports moq-net; Cargo.lock holds moq-net at 0.3.15.
moq-tokio = "0.19.28"
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs"] }
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
serde_json = { version = "1", features = ["preserve_order"] }
bytes = "1"
rand = "0.10"
tempfile = "3"
