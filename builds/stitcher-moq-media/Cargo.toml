[package]
name = "stitcher-moq-media-client"
version = "0.1.0"
edition = "2021"

[dependencies]
# moq-tokio 0.19.35 / moq-net 0.3.22 is the moq-relay 0.17.15 release train (2026-11-08), the pair
# builds/stitcher-moq uses, so the two stitcher-moq clients in this repository speak the same wire
# code. It carries moq-dev #8035 (a Hop ID at or above 2^62 reads as unknown), without which the
# publisher session to a moqx relay closes right after the announce. moq-tokio re-exports moq-net;
# Cargo.lock holds moq-net at 0.3.22.
moq-tokio = "0.19.35"
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs"] }
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
hex = "0.4"
bytes = "1"
rand = "0.10"
tempfile = "3"
