const view = document.getElementById("view");
const TLABEL = { quic: "QUIC", webtransport: "WT" };
// Docker runs are the controlled results; public endpoints are kept apart.
const DOCKER = DATA.runs.filter(r => r.source === "docker");
const REMOTE = DATA.runs.filter(r => r.source === "remote");
// Drafts newest first, then other protocols (e.g. moq-lite) by name.
const draftsOf = runs => [...new Set(runs.map(r => r.draft).filter(d => d != null))]
  .sort((a, b) => (typeof a === "number" && typeof b === "number") ? b - a
    : typeof a === "number" ? -1 : typeof b === "number" ? 1 : String(a).localeCompare(String(b)));
const draftLabel = d => typeof d === "number" ? `draft-${d}` : d;
const parseDraft = v => /^\d+$/.test(v) ? +v : v;
const PINNED = DATA.runs.some(r => r.basis === "pinned");
const PIN_GLYPH = { both: "●", client: "◐", relay: "◑", none: "○" };
const PIN_TEXT = { both: "client and relay pinned", client: "client pinned", relay: "relay pinned", none: "neither side can be pinned" };
const DOCKER_DRAFTS = draftsOf(DOCKER);
const REMOTE_DRAFTS = draftsOf(REMOTE);
const state = { view: "draft", draft: DOCKER_DRAFTS[0] ?? null, openDraft: REMOTE_DRAFTS[0] ?? null, pick: null };

function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid instanceof Node ? kid : String(kid));
  return el;
}
function score(run) {
  const pass = run.tests.filter(t => t.status === "pass").length;
  const fail = run.tests.filter(t => t.status === "fail").length;
  const skip = run.tests.filter(t => t.status === "skip").length;
  let cls;
  if (run.status === "skip") cls = "skip";
  else if (!run.tests.length) cls = run.status === "pass" ? "pass" : "fail";
  else if (!fail) cls = "pass";
  else if (!pass) cls = "fail";
  else cls = "partial";
  return { pass, fail, skip, cls, text: run.status === "skip" ? "skip" : (run.tests.length ? `${pass}/${pass + fail}` : run.status) };
}
function endpointLabel(run) {
  const base = `${run.source === "remote" ? "remote" : "docker"} · ${TLABEL[run.transport] || run.transport}`;
  return run.confined ? `${base} · ${PIN_TEXT[run.confined]}` : base;
}
function versionText(run) {
  if (run.basis === "pinned") {
    const got = run.negotiated.map(d => "moqt-" + d).concat(run.other_protocols || []).join(", ");
    return run.pin_check === "verified" ? `pinned draft-${run.draft} · reported ${got}`
      : run.pin_check === "mismatch" ? `pinned draft-${run.draft} · reported ${got} (confinement failed)`
      : `pinned draft-${run.draft} · not reported`;
  }
  if (run.other_protocols && run.other_protocols.length && !run.negotiated.length) return run.other_protocols.join(", ");
  if (run.negotiated.length) {
    const v = run.negotiated.map(d => "moqt-" + d).join(", ");
    return run.predicted && !run.negotiated.includes(run.predicted) ? `${v} (predicted draft-${run.predicted})` : v;
  }
  return run.predicted ? `predicted draft-${run.predicted}` : "unknown";
}
function pill(run) {
  const s = score(run);
  const pin = run.confined ? `${PIN_TEXT[run.confined]} · ` : "";
  const title = `${endpointLabel(run)} · ${pin}${s.text}${s.skip ? ` (+${s.skip} skipped)` : ""} · ${versionText(run)}`;
  const state = run.basis === "pinned" ? (run.pin_check === "verified" ? "" : run.pin_check) : (run.basis === "predicted" ? "predicted" : "");
  return h("span", { class: `pill ${s.cls} ${state}`, title },
    run.confined ? h("span", { class: "g", "aria-hidden": "true" }, PIN_GLYPH[run.confined]) : null,
    h("span", { class: "t" }, run.transport === "quic" ? "Q" : "W"), s.text);
}
function legend(pinned) {
  const sample = (cls, extra, t, txt, g) => h("span", { class: `pill ${cls} ${extra}` },
    g ? h("span", { class: "g" }, g) : null, h("span", { class: "t" }, t), txt);
  const items = [sample("pass", "", "Q", "8/8"), "native QUIC", sample("pass", "", "W", "6/6"), "WebTransport"];
  if (pinned) items.push(
    sample("pass", "", "Q", "8/8", PIN_GLYPH.both), "both pinned",
    sample("pass", "", "Q", "8/8", PIN_GLYPH.client), "client pinned",
    sample("pass", "", "Q", "8/8", PIN_GLYPH.relay), "relay pinned",
    sample("pass", "", "Q", "8/8", PIN_GLYPH.none), "neither can be pinned: run once, placed by the version it reported (italic if none)",
    sample("pass", "unreported", "Q", "8/8"), "client didn't report its version (italic)",
    sample("fail", "mismatch", "Q", "0/8"), "client reported another version");
  else items.push(sample("pass", "predicted", "W", "6/6"), "draft predicted, not reported (italic)");
  items.push(h("span", {}, "Counts are passed / (passed + failed); skips in the tooltip."));
  return h("div", { class: "legend" }, items);
}
function byKey(list, key) {
  const m = new Map();
  for (const x of list) { const k = key(x); if (!m.has(k)) m.set(k, []); m.get(k).push(x); }
  return m;
}
function drillPanel(title, runs, note) {
  const ids = DATA.test_ids.filter(id => runs.some(r => r.tests.some(t => t.id === id)));
  const head = h("tr", {}, h("th", { class: "id" }, "test"),
    runs.map(r => h("th", {}, endpointLabel(r),
      h("span", { class: "sub" }, versionText(r)),
      h("span", { class: "sub" }, r.log ? h("a", { href: r.log, target: "_blank", rel: "noopener" }, "log") : (r.skip_reason || "no log")))));
  const rows = ids.map(id => h("tr", {}, h("td", { class: "id" }, id),
    runs.map(r => {
      const t = r.tests.find(x => x.id === id);
      if (!t) return h("td", { class: "mark skip" }, "—");
      const sym = t.status === "pass" ? "ok" : t.status === "fail" ? "not ok" : "skip";
      const ver = t.negotiated.length ? ` · moqt-${t.negotiated.join("/")}` : "";
      return h("td", { title: (t.raw_id ? `${t.raw_id} → ${id}. ` : "") + (t.message || "") },
        h("span", { class: `mark ${t.status}` }, sym), h("span", { class: "sub" }, (t.message ? t.message.slice(0, 80) : "") + ver));
    })));
  const empty = !ids.length ? h("p", { class: "note" }, "No TAP results in these logs (the client failed before reporting, or the run was skipped).") : null;
  return h("section", { class: "panel", id: "drill", "aria-live": "polite" },
    h("h2", {}, title), note ? h("p", { class: "note" }, note) : null,
    empty || h("div", { class: "scroller" }, h("table", { class: "tests" }, h("thead", {}, head), h("tbody", {}, rows))));
}
function matrix(rowsKeys, colKeys, cellRuns, onPick, picked, corner) {
  const thead = h("thead", {}, h("tr", {}, h("th", { class: "corner" }, corner), colKeys.map(c => h("th", { scope: "col" }, c))));
  const tbody = h("tbody", {}, rowsKeys.map(r => h("tr", {}, h("th", { scope: "row" }, r),
    colKeys.map(c => {
      const runs = cellRuns(r, c);
      if (!runs.length) return h("td", { class: "empty" }, "·");
      const key = `${r}|${c}`;
      return h("td", {}, h("button", { class: "cellbtn", "aria-expanded": picked === key ? "true" : "false",
        "aria-label": `${r} with ${c}`, onclick: () => onPick(key, r, c, runs) }, runs.map(pill)));
    }))));

}
function sortRuns(runs) {
  return runs.slice().sort((a, b) => (a.source > b.source) - (a.source < b.source) || (a.transport > b.transport) - (a.transport < b.transport));
}

function matrixPage(runsAll, drafts, key, intro, cornerLabel) {
  const d = state[key];
  const at = runsAll.filter(r => r.draft === d);
  const select = h("select", { id: `${key}-select`, onchange: e => { state[key] = parseDraft(e.target.value); state.pick = null; render(); } },
    drafts.map(x => h("option", { value: x, selected: x === d }, `${draftLabel(x)} · ${runsAll.filter(r => r.draft === x).length} runs`)));
  const clients = [...new Set(at.map(r => r.client))].sort();
  const relays = [...new Set(at.map(r => r.relay))].sort();
  const cells = byKey(at, r => `${r.client}|${r.relay}`);
  const tests = at.flatMap(r => r.tests);
  const passed = tests.filter(t => t.status === "pass").length;
  const negotiated = at.filter(r => r.basis === "negotiated").length;
  const drill = state.pick && state.pick.view === state.view && state.pick.draft === d ? state.pick : null;
  view.replaceChildren(
    h("p", { class: "intro" }, intro),
    h("div", { class: "toolbar" }, h("label", { class: "label", for: `${key}-select` }, "Draft"), select),
    h("div", { class: "facts" },
      h("span", {}, h("b", {}, at.length), "runs"),
      h("span", {}, h("b", {}, cells.size), "client–relay pairs"),
      h("span", {}, h("b", {}, tests.length ? Math.round(100 * passed / tests.length) + "%" : "–"), "of test results pass"),
      runsAll.some(r => r.basis === "pinned")
        ? h("span", {}, h("b", {}, at.length ? Math.round(100 * at.filter(r => r.pin_check === "verified").length / at.length) + "%" : "–"), "verified by the client's report")
        : h("span", {}, h("b", {}, at.length ? Math.round(100 * negotiated / at.length) + "%" : "–"), "placed by reported version")),
    legend(runsAll.some(r => r.basis === "pinned")),
    matrix(clients, relays, (c, r) => sortRuns(cells.get(`${c}|${r}`) || []),
      (k, c, r, runs) => { state.pick = { key: k, view: state.view, draft: d, title: [c, r], runs }; render(); document.getElementById("drill")?.scrollIntoView({ block: "nearest" }); },
      drill?.key, cornerLabel),
    drill ? drillPanel(h("span", {}, h("code", {}, drill.title[0]), " → ", h("code", {}, drill.title[1]), ` at ${draftLabel(d)}`), drill.runs) : null);
}

function renderDraft() {
  matrixPage(DOCKER, DOCKER_DRAFTS, "draft", PINNED
    ? "Docker runs only, each pair run once per draft both sides register. Each side is pinned to the draft where its registration says how; a side that can't be pinned runs as registered and the pill shows it. The client's own report of the version it negotiated confirms each run. Public endpoints are under Open relays."
    : "Docker runs only: the relay runs in a container beside the client, so every result here comes from a controlled run. Each run sits at the MoQT draft its client reported negotiating; clients that report nothing are placed at the runner's prediction, shown in italics. Public endpoints are under Open relays.",
    "client ↓  relay →");
}

function renderOpen() {
  matrixPage(REMOTE, REMOTE_DRAFTS, "openDraft",
    "Public relay endpoints, tested separately from the docker runs: results depend on the live deployment and the network path. Each cell shows the relay's native QUIC and H3/WebTransport endpoints side by side.",
    "client ↓  open relay →");
}

function render() {
  for (const t of document.querySelectorAll(".tab")) t.setAttribute("aria-selected", t.dataset.view === state.view ? "true" : "false");
  if (state.view === "draft") renderDraft();
  else renderOpen();
}
for (const t of document.querySelectorAll(".tab")) t.addEventListener("click", () => {
  state.view = t.dataset.view; state.pick = null;
  try { history.replaceState(null, "", "#" + state.view); } catch (e) {}
  render();
});
const initial = (location.hash || "").slice(1);
if (["draft", "open"].includes(initial)) state.view = initial;
document.getElementById("runinfo").textContent =
  (DATA.pinned ? `pinned ${DATA.pinned.id} · ${DOCKER.length} docker runs · ` : `run ${DATA.run.id} · ${DOCKER.length} docker runs · `)
  + `${REMOTE.length} open-relay runs (${DATA.run.id})`;
render();
