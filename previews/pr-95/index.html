function matrix(rowsKeys, colKeys, cellRuns, onPick, picked, corner) {
  const thead = h("thead", {}, h("tr", {}, h("th", { class: "corner" }, corner), colKeys.map(c => h("th", { scope: "col" }, c))));
  const tbody = h("tbody", {}, rowsKeys.map(r => h("tr", {}, h("th", { scope: "row" }, r),
    colKeys.map(c => {
      const runs = cellRuns(r, c);
      if (!runs.length) return h("td", { class: "empty" }, "·");
      const key = `${r}|${c}`;
      return h("td", {}, h("button", { class: "cellbtn", "aria-expanded": picked === key ? "true" : "false",
        "aria-label": `${r} with ${c}`, onclick: () => onPick(key, r, c, runs) }, runs.map(pill)));
    }))));
  return h("div", { class: "scroller" }, h("table", { class: "matrix" }, thead, tbody));
}
function sortRuns(runs) {
  return runs.slice().sort((a, b) => (a.source > b.source) - (a.source < b.source) || (a.transport > b.transport) - (a.transport < b.transport));
}

function renderDraft() {
  const d = state.draft;
  const at = DATA.runs.filter(r => r.draft === d);
  const segs = DATA.drafts.map(x => h("button", { class: "seg", id: `draft-${x}`, "aria-pressed": x === d ? "true" : "false",
    onclick: () => { state.draft = x; state.pick = null; render(); } }, `draft-${x}`, h("span", { class: "n" }, DATA.runs.filter(r => r.draft === x).length)));
  const clients = [...new Set(at.map(r => r.client))].sort();
  const relays = [...new Set(at.map(r => r.relay))].sort();
  const cells = byKey(at, r => `${r.client}|${r.relay}`);
  const tests = at.flatMap(r => r.tests);
  const passed = tests.filter(t => t.status === "pass").length;
  const negotiated = at.filter(r => r.basis === "negotiated").length;
  const drill = state.pick && state.pick.draft === d ? state.pick : null;
  view.replaceChildren(
    h("p", { class: "intro" }, "Each run sits at the MoQT draft its client reported negotiating. Clients that report nothing are placed at the runner's prediction, shown in italics. One pill per endpoint: docker relays and public endpoints, native QUIC and WebTransport."),
    h("div", { class: "toolbar", role: "group", "aria-label": "Draft" }, h("span", { class: "label" }, "Draft"), segs),
    h("div", { class: "facts" },
      h("span", {}, h("b", {}, at.length), "runs"),
      h("span", {}, h("b", {}, cells.size), "client–relay pairs"),
      h("span", {}, h("b", {}, tests.length ? Math.round(100 * passed / tests.length) + "%" : "–"), "of test results pass"),
      h("span", {}, h("b", {}, at.length ? Math.round(100 * negotiated / at.length) + "%" : "–"), "placed by reported version")),
    legend(),
    matrix(clients, relays, (c, r) => sortRuns(cells.get(`${c}|${r}`) || []),
      (key, c, r, runs) => { state.pick = { key, draft: d, title: [c, r], runs }; render(); document.getElementById("drill")?.scrollIntoView({ block: "nearest" }); },
      drill?.key, "client ↓  relay →"),
    drill ? drillPanel(h("span", {}, h("code", {}, drill.title[0]), " → ", h("code", {}, drill.title[1]), ` at draft-${d}`), drill.runs) : null);
}

function renderImpl() {
  const names = Object.keys(DATA.implementations).filter(k => DATA.runs.some(r => r.client === k || r.relay === k)).sort();
  if (!state.impl || !names.includes(state.impl)) state.impl = names[0];
  const k = state.impl, meta = DATA.implementations[k];
  const chips = names.map(n => h("button", { class: "chip", "aria-pressed": n === k ? "true" : "false",
    onclick: () => { state.impl = n; state.pick = null; render(); } }, n,
    h("span", { class: "r" }, DATA.implementations[n].roles.filter(x => x !== "publisher").join(" + "))));
  const drafts = DATA.drafts;
  const side = (role) => {
    const runs = DATA.runs.filter(r => r[role] === k);
    if (!runs.length) return null;
    const other = role === "client" ? "relay" : "client";
    const peers = [...new Set(runs.map(r => r[other]))].sort();
    const cells = byKey(runs, r => `${r[other]}|draft-${r.draft}`);
    return h("section", { class: "panel" },
      h("h3", {}, role === "client" ? `${k} as client` : `${k} as relay`),
      matrix(peers, drafts.map(d => `draft-${d}`), (p, d) => sortRuns(cells.get(`${p}|${d}`) || []),
        (key, p, d, rs) => { state.pick = { key: role + key, title: role === "client" ? [k, p] : [p, k], draftLabel: d, runs: rs }; render(); document.getElementById("drill")?.scrollIntoView({ block: "nearest" }); },
        state.pick && state.pick.key.startsWith(role) ? state.pick.key.slice(role.length) : null,
        role === "client" ? "relay ↓" : "client ↓"));
  };
  const drill = state.pick && (state.pick.title[0] === k || state.pick.title[1] === k) ? state.pick : null;
  view.replaceChildren(
    h("p", { class: "intro" }, "Pick an implementation to see every pairing it took part in, by draft, as client and as relay."),
    h("div", { class: "chips", role: "group", "aria-label": "Implementation" }, chips),
    h("div", { class: "facts" },
      meta.organization ? h("span", {}, h("b", {}, meta.organization)) : null,
      h("span", {}, "registered drafts ", h("b", {}, meta.drafts.map(d => d).join(" · ") || "–")),
      meta.repository ? h("a", { href: meta.repository, target: "_blank", rel: "noopener" }, "repository") : null),
    legend(),
    h("div", { class: "grid2" }, side("client"), side("relay")),
    drill ? drillPanel(h("span", {}, h("code", {}, drill.title[0]), " → ", h("code", {}, drill.title[1]), ` at ${drill.draftLabel}`), drill.runs) : null);
}

function renderOpen() {
  const remote = DATA.runs.filter(r => r.source === "remote");
  const eps = byKey(remote, r => `${r.relay}|${r.transport}|${r.target}`);
  const keys = [...eps.keys()].sort();
  const drafts = DATA.drafts;
  const rows = keys.map(key => {
    const [relay, transport, target] = key.split("|");
    const runs = eps.get(key);
    const clients = byKey(runs, r => r.client);
    const full = [...clients.values()].filter(rs => rs.every(r => { const s = score(r); return s.cls === "pass"; })).length;
    return h("tr", {},
      h("th", { scope: "row" }, relay, h("span", { class: "sub" }, `${TLABEL[transport] || transport} · ${target}`)),
      h("td", { class: "id" }, `${full}/${clients.size}`),
      drafts.map(d => {
        const at = runs.filter(r => r.draft === d);
        if (!at.length) return h("td", { class: "empty" }, "·");
        const okc = at.filter(r => score(r).cls === "pass").length;
        return h("td", {}, h("button", { class: "cellbtn", "aria-expanded": state.open === `${key}|${d}` ? "true" : "false",
          onclick: () => { state.open = `${key}|${d}`; render(); document.getElementById("drill")?.scrollIntoView({ block: "nearest" }); } },
          h("span", { class: `pill ${okc === at.length ? "pass" : okc ? "partial" : "fail"}` }, `${okc}/${at.length} clients`)));
      }));
  });
  let drill = null;
  if (state.open) {
    const parts = state.open.split("|"), d = +parts[3];
    const runs = (eps.get(parts.slice(0, 3).join("|")) || []).filter(r => r.draft === d).sort((a, b) => a.client.localeCompare(b.client));
    drill = h("section", { class: "panel", id: "drill" },
      h("h2", {}, h("code", {}, parts[0]), ` ${TLABEL[parts[1]] || parts[1]} at draft-${d}`),
      h("p", { class: "note" }, parts[2]),
      h("div", { class: "scroller" }, h("table", { class: "tests" },
        h("thead", {}, h("tr", {}, h("th", {}, "client"), h("th", {}, "result"), h("th", {}, "version"), h("th", {}, "log"))),
        h("tbody", {}, runs.map(r => h("tr", {}, h("td", { class: "id" }, r.client), h("td", {}, pill(r)), h("td", { class: "id" }, versionText(r)),
          h("td", {}, r.log ? h("a", { href: r.log, target: "_blank", rel: "noopener" }, "log") : "–")))))));
  }
  view.replaceChildren(
    h("p", { class: "intro" }, "Public relay endpoints registered with the runner, and how every client fared against each, by the draft the run reached."),
    h("div", { class: "scroller" }, h("table", { class: "matrix" },
      h("thead", {}, h("tr", {}, h("th", { class: "corner" }, "endpoint"), h("th", {}, "clients all-pass"), drafts.map(d => h("th", {}, `draft-${d}`)))),
      h("tbody", {}, rows))),
    drill);
}

function render() {
  for (const t of document.querySelectorAll(".tab")) t.setAttribute("aria-selected", t.dataset.view === state.view ? "true" : "false");
  if (state.view === "draft") renderDraft();
  else if (state.view === "impl") renderImpl();
  else renderOpen();
}
for (const t of document.querySelectorAll(".tab")) t.addEventListener("click", () => {
  state.view = t.dataset.view; state.pick = null; state.open = null;
  try { history.replaceState(null, "", "#" + state.view); } catch (e) {}
  render();
});
const initial = (location.hash || "").slice(1);
if (["draft", "impl", "open"].includes(initial)) state.view = initial;
document.getElementById("runinfo").textContent =
  `run ${DATA.run.id} · ${DATA.runs.length} runs · ${DATA.run.timestamp || ""}`.trim();
render();
</script>
